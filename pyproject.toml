[project]
name = "flux"
version = "0.2.3"
description = "Clipboard QR code generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyperclip>=1.9.0",
    "qrcode>=8.0",
    "Pillow>=11.0.0",
    "pywin32>=308; sys_platform == 'win32'",
    "pyqt6>=6.11.0",
    "flet>=0.25.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.11.0",
]
